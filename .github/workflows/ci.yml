name: Build and check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Audit publication surface
        run: python tools/audit_release.py --source . --archive release/Luma-win-x64.zip --assembly Luma/bin/Release/net10.0-windows/win-x64/Luma.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Luma-win-x64
          path: |
            release/Luma-win-x64.zip
            release/SHA256SUMS.txt
          retention-days: 7

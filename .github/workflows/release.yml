name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v1.4.0
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build release
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Audit publication surface
        run: python tools/audit_release.py --source . --archive release/Luma-win-x64.zip --assembly Luma/bin/Release/net10.0-windows/win-x64/Luma.dll
      - name: Publish checked assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag' }
          $version = ([xml](Get-Content Luma/Luma.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne ('v' + $version)) { throw 'Tag does not match project version' }
          gh release create $env:RELEASE_TAG release/Luma-win-x64.zip release/SHA256SUMS.txt --verify-tag --title ('Luma ' + $version) --notes-file RELEASE_NOTES.md
